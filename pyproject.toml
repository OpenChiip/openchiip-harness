[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openchiip-harness"
version = "0.0.30"
description = "OpenChiip Harness — 智能体运行框架，支持平台协同"
readme = "README.md"
license = {text = "AIGCGPL-1.0"}
requires-python = ">=3.10"
dependencies = [
    # 核心运行时依赖（现有）
    "websockets>=12.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    # FastAPI 服务器（新增）
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "httpx>=0.27.0",
    # Fernet 加密（仓库凭据存储）
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
]

[project.scripts]
openchiip-harness = "agent_runtime.cli:main"
# 兼容旧入口
agent-runtime = "agent_runtime.daemon:main"

[tool.setuptools.packages.find]
include = ["agent_runtime*"]
